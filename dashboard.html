<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRP Evidence Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: .75rem;
        }

        .card-header {
            background-color: #006400;
            color: #fff;
            font-weight: 600;
        }

        .footer {
            background-color: #343a40;
            color: #ccc;
            padding: 1rem 0;
        }

            .footer a {
                color: #adb5bd;
            }

                .footer a:hover {
                    color: #fff;
                }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">CRP Evidence Dashboard</a>
        </div>
    </nav>

    <div class="container my-4">
        <h1 class="mb-4 text-center">Conservation Reserve Program Evidence Map</h1>
        <div class="row g-4">
            <!-- Publications Over Time -->
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header">Papers Published Per Year</div>
                    <div class="card-body">
                        <div id="pubsChart"></div>
                    </div>
                </div>
            </div>

            <!-- Open Access Uptake -->
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header">Open Access Uptake (%)</div>
                    <div class="card-body">
                        <div id="oaChart"></div>
                    </div>
                </div>
            </div>

            <!-- Domain Distribution -->
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header">Top Domains</div>
                    <div class="card-body">
                        <div id="domainChart"></div>
                    </div>
                </div>
            </div>

            <!-- Field Distribution -->
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header">Top Fields</div>
                    <div class="card-body">
                        <div id="fieldChart"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center">
        <div class="container">
            <p class="mb-0">&copy; 2025 CRP Evidence Dashboard | <a href="#">GitHub Repo</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script>
        (async function () {
            const resp = await fetch('metrics.json');
            if (!resp.ok) {
                console.error('Failed to load metrics.json:', resp.statusText);
                return;
            }
            const m = await resp.json();

            // 1) Publications Over Time
            const yrs = m.publications_over_time.by_year.map(o => o.year);
            const cnt = m.publications_over_time.by_year.map(o => o.count);
            Plotly.newPlot('pubsChart', [{
                x: yrs, y: cnt, type: 'scatter', mode: 'lines+markers',
                marker: { color: '#006400' }
            }], {
                margin: { t: 20, r: 20, b: 40, l: 40 },
                xaxis: { title: 'Year' },
                yaxis: { title: 'Papers Published' }
            });

            // 2) Open Access Uptake
            const oa = Object.entries(m.open_access_uptake)
                .sort((a, b) => a[0] - b[0]);
            Plotly.newPlot('oaChart', [{
                x: oa.map(e => e[0]), y: oa.map(e => e[1]), type: 'bar',
                marker: { color: '#228B22' }
            }], {
                margin: { t: 20, r: 20, b: 40, l: 40 },
                xaxis: { title: 'Year' },
                yaxis: { title: '% Open Access', range: [0, 100] }
            });

            // 3) Domain Distribution
            const dom = m.domain_distribution.slice(0, 10);
            Plotly.newPlot('domainChart', [{
                labels: dom.map(d => d[0]), values: dom.map(d => d[1]), type: 'pie',
                textinfo: 'percent+label'
            }], {
                margin: { t: 20, r: 20, b: 20, l: 20 }
            });

            // 4) Field Distribution
            const fld = m.field_distribution.slice(0, 10).reverse();
            Plotly.newPlot('fieldChart', [{
                x: fld.map(d => d[1]), y: fld.map(d => d[0]), type: 'bar', orientation: 'h',
                marker: { color: '#2E8B57' }
            }], {
                margin: { t: 20, r: 20, b: 40, l: 100 },
                xaxis: { title: 'Number of Papers' }
            });
        })();
    </script>
</body>
</html>
